name: CI

# Every push to the main lines and every pull request gets an answer from the
# repository itself: tests, migrations, types, lint and a production build.
on:
  push:
    branches: [dev, main, "redesign/**"]
  pull_request:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject.toml declares (all tests pass on it), 3.13 the current release.
        python: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Includes tests/api and tests/api/test_migrations.py (models vs migrations).
      - name: pytest
        run: python -m pytest tests -q

      - name: Migrations apply to a fresh database
        env:
          NOVEL_OS_DATA_DIR: ${{ runner.temp }}/novel-os-data
          NOVEL_OS_DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-smoke.db
        run: |
          python -m alembic upgrade head
          python -m alembic current | tee /dev/stderr | grep -q "(head)"

      - name: Launcher imports
        run: python -m novel_os --help

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build (standalone)
        run: npx next build
