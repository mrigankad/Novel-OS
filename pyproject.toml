[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-os"
version = "2.0.0"
description = "An AI novel-writing studio: agents with memory, continuity, research, voice and publishing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }  # table form: setuptools rejects an SPDX string plus a license classifier
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
]
# requirements.txt stays the single source of dependencies.
dynamic = ["dependencies"]

[project.optional-dependencies]
# Mirrors requirements-dev.txt (which also pulls in requirements.txt via -r).
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.48"]

[project.scripts]
novel-os = "novel_os.__main__:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["novel_os*", "server*", "core*"]
