[pytest]
# Put the repository root on sys.path so `from api.main import …` resolves.
#
# This worked locally only by accident: `python -m pytest` prepends the working
# directory to sys.path, while a bare `pytest` does not. Everything passed for
# months and then failed the first time CI ran it the documented way. Declaring
# it here means both invocations behave the same, for contributors too.
pythonpath = .

testpaths = tests

# The engine is exercised against fakes; nothing here should reach a network.
addopts = -q

# Silences a pytest-asyncio deprecation warning about an unset default.
asyncio_default_fixture_loop_scope = function
